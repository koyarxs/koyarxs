<svg xmlns="http://www.w3.org/2000/svg" width="600" height="290" viewBox="0 0 600 290" role="img" aria-labelledby="title desc"><title id="title">Learning quest / no percentages</title><desc id="desc">Original cartoon illustration. Decorative animation, not live telemetry.</desc><style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.mono{font-family:Consolas,Menlo,monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,40%,100%{opacity:1}60%,85%{opacity:.35}}
@keyframes travel{0%{stroke-dashoffset:80}100%{stroke-dashoffset:0}}
@keyframes steam{0%{opacity:0;transform:translateY(5px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}
@keyframes type{0%,12%{clip-path:inset(0 100% 0 0)}65%,100%{clip-path:inset(0 0 0 0)}}
@keyframes hand{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-4deg)}}
@keyframes bugwalk{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
.float{animation:float 6s ease-in-out infinite}.late{animation-delay:-3s}.led{animation:blink 5s ease-in-out infinite}
.flow{stroke-dasharray:7 18;animation:travel 8s linear infinite}.steam{animation:steam 5s ease-out infinite}
.typing{animation:type 14s steps(40) infinite}.hand{transform-origin:40px 0;animation:hand 1.8s ease-in-out infinite}
.bugwalk{animation:bugwalk 10s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.typing{clip-path:none!important}.steam{opacity:.5!important}}</style><rect x="0" y="0" width="600" height="290" rx="8" fill="#121B32" /><text x="28" y="38" fill="#69DFEB" font-size="24" font-weight="700">CURRENT QUEST</text><text x="28" y="88" fill="#F4F7FF" font-size="25" font-weight="700">Become a stronger Software Engineer</text><text x="28" y="126" fill="#69DFEB" font-size="21" >Full Stack → architecture → quality</text><text x="28" y="162" fill="#BACAE4" font-size="21" >DevOps · security · cloud · mobile</text><path d="M28 204h544" fill="none" stroke="#202C49" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><path d="M28 204h544" fill="none" stroke="#82E2B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="flow"/><text x="28" y="253" fill="#FFE294" font-size="18" >Learning journey / not a proficiency score</text></svg>