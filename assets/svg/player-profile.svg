<svg xmlns="http://www.w3.org/2000/svg" width="600" height="494" viewBox="0 0 600 494" role="img" aria-labelledby="title desc"><title id="title">Player profile / professional identity</title><desc id="desc">Original cartoon illustration. Decorative animation, not live telemetry.</desc><style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.mono{font-family:Consolas,Menlo,monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,40%,100%{opacity:1}60%,85%{opacity:.35}}
@keyframes travel{0%{stroke-dashoffset:80}100%{stroke-dashoffset:0}}
@keyframes steam{0%{opacity:0;transform:translateY(5px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}
@keyframes type{0%,12%{clip-path:inset(0 100% 0 0)}65%,100%{clip-path:inset(0 0 0 0)}}
@keyframes hand{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-4deg)}}
@keyframes bugwalk{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
.float{animation:float 6s ease-in-out infinite}.late{animation-delay:-3s}.led{animation:blink 5s ease-in-out infinite}
.flow{stroke-dasharray:7 18;animation:travel 8s linear infinite}.steam{animation:steam 5s ease-out infinite}
.typing{animation:type 14s steps(40) infinite}.hand{transform-origin:40px 0;animation:hand 1.8s ease-in-out infinite}
.bugwalk{animation:bugwalk 10s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.typing{clip-path:none!important}.steam{opacity:.5!important}}</style><rect x="0" y="0" width="600" height="494" rx="8" fill="#121B32" /><text x="28" y="38" fill="#69DFEB" font-size="24" font-weight="700">PLAYER PROFILE</text><g transform="translate(486 178) scale(1.05)"><g class=""><path d="M-12 64v32h-16M14 64v32h17" fill="none" stroke="#0B1224" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" /><path d="M-20-2Q0-10 20-2l9 60q-27 15-57 0Z" fill="#74A9FF" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M-5 5v18M6 5v18" fill="none" stroke="#F4F7FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-20 10l-22-20-5-24M20 12l15 23" fill="none" stroke="#E7AE8A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><circle cx="0" cy="-36" r="25" fill="#F1C29F" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M-25-32q-7-36 28-33 27 1 22 31L12-46l-15 6-19-3Z" fill="#0B1224"/><circle cx="-8" cy="-33" r="2.5" fill="#0B1224" /><circle cx="9" cy="-33" r="2.5" fill="#0B1224" /><path d="M-5-21q6 5 12-1" fill="none" stroke="#0B1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g><g transform="translate(484 319) scale(0.85)"><g class="float"><path d="M-9 18l-7 9M9 18l7 9" fill="none" stroke="#0B1224" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-20" y="-15" width="40" height="37" rx="8" fill="#82E2B5" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M0-15v-9" fill="none" stroke="#82E2B5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="0" cy="-26" r="4" fill="#FFE294" /><rect x="-14" y="-8" width="28" height="14" rx="5" fill="#0B1224" /><circle cx="-7" cy="-1" r="3" fill="#69DFEB" /><circle cx="7" cy="-1" r="3" fill="#69DFEB" /><path d="M-5 12h10" fill="none" stroke="#0B1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="28" y="83" fill="#BACAE4" font-size="12" >PLAYER</text><text x="28" y="106" fill="#F4F7FF" font-size="22" font-weight="700">Yerko Barrera</text><text x="28" y="140" fill="#BACAE4" font-size="12" >CLASS</text><text x="28" y="163" fill="#F4F7FF" font-size="22" font-weight="700">Software Engineer</text><text x="28" y="197" fill="#BACAE4" font-size="12" >SPECIALIZATION</text><text x="28" y="220" fill="#F4F7FF" font-size="22" font-weight="700">Full Stack Development</text><text x="28" y="254" fill="#BACAE4" font-size="12" >BACKGROUND</text><text x="28" y="277" fill="#F4F7FF" font-size="22" font-weight="700">IT Support</text><text x="28" y="311" fill="#BACAE4" font-size="12" >MAIN QUEST</text><text x="28" y="334" fill="#F4F7FF" font-size="22" font-weight="700">Build. Learn. Improve.</text><text x="28" y="368" fill="#BACAE4" font-size="12" >CURRENT STATUS</text><text x="28" y="391" fill="#F4F7FF" font-size="22" font-weight="700">Building &amp; Learning</text><circle cx="42" cy="434" r="5" fill="#82E2B5" class="led"/><text x="57" y="439" fill="#BACAE4" font-size="14" >ONLINE / playful status, not presence</text><text x="28" y="475" fill="#FFE294" font-size="17" >Side quests: gaming · music · personal projects</text></svg>