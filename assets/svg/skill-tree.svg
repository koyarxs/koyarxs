<svg xmlns="http://www.w3.org/2000/svg" width="980" height="480" viewBox="0 0 980 480" role="img" aria-labelledby="title desc"><title id="title">Skill tree / qualitative learning roadmap</title><desc id="desc">Original cartoon illustration. Decorative animation, not live telemetry.</desc><style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.mono{font-family:Consolas,Menlo,monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,40%,100%{opacity:1}60%,85%{opacity:.35}}
@keyframes travel{0%{stroke-dashoffset:80}100%{stroke-dashoffset:0}}
@keyframes steam{0%{opacity:0;transform:translateY(5px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}
@keyframes type{0%,12%{clip-path:inset(0 100% 0 0)}65%,100%{clip-path:inset(0 0 0 0)}}
@keyframes hand{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-4deg)}}
@keyframes bugwalk{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
.float{animation:float 6s ease-in-out infinite}.late{animation-delay:-3s}.led{animation:blink 5s ease-in-out infinite}
.flow{stroke-dasharray:7 18;animation:travel 8s linear infinite}.steam{animation:steam 5s ease-out infinite}
.typing{animation:type 14s steps(40) infinite}.hand{transform-origin:40px 0;animation:hand 1.8s ease-in-out infinite}
.bugwalk{animation:bugwalk 10s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.typing{clip-path:none!important}.steam{opacity:.5!important}}</style><rect x="0" y="0" width="980" height="480" rx="8" fill="#121B32" /><text x="28" y="38" fill="#69DFEB" font-size="24" font-weight="700">SKILL TREE</text><text x="28" y="70" fill="#F4F7FF" font-size="21" >Software engineering / always growing</text><path d="M490 82v29" fill="none" stroke="#74A9FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M49 121v73" fill="none" stroke="#82E2B5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="49" cy="133" r="8" fill="#82E2B5" /><text x="70" y="149" fill="#F4F7FF" font-size="21" font-weight="700">Frontend</text><text x="70" y="180" fill="#82E2B5" font-size="14" >ACTIVE</text><path d="M356 121v73" fill="none" stroke="#82E2B5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="356" cy="133" r="8" fill="#82E2B5" /><text x="377" y="149" fill="#F4F7FF" font-size="21" font-weight="700">Backend</text><text x="377" y="180" fill="#82E2B5" font-size="14" >ACTIVE</text><path d="M663 121v73" fill="none" stroke="#82E2B5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="663" cy="133" r="8" fill="#82E2B5" /><text x="684" y="149" fill="#F4F7FF" font-size="21" font-weight="700">Database</text><text x="684" y="180" fill="#82E2B5" font-size="14" >ACTIVE</text><path d="M49 233v73" fill="none" stroke="#FFE294" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="49" cy="245" r="8" fill="#FFE294" /><text x="70" y="261" fill="#F4F7FF" font-size="21" font-weight="700">Testing</text><text x="70" y="292" fill="#FFE294" font-size="14" >LEVELING UP</text><path d="M356 233v73" fill="none" stroke="#FFE294" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="356" cy="245" r="8" fill="#FFE294" /><text x="377" y="261" fill="#F4F7FF" font-size="21" font-weight="700">Architecture</text><text x="377" y="292" fill="#FFE294" font-size="14" >LEVELING UP</text><path d="M663 233v73" fill="none" stroke="#FFE294" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="663" cy="245" r="8" fill="#FFE294" /><text x="684" y="261" fill="#F4F7FF" font-size="21" font-weight="700">DevOps</text><text x="684" y="292" fill="#FFE294" font-size="14" >LEVELING UP</text><path d="M49 345v73" fill="none" stroke="#FFE294" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="49" cy="357" r="8" fill="#FFE294" /><text x="70" y="373" fill="#F4F7FF" font-size="21" font-weight="700">Cybersecurity</text><text x="70" y="404" fill="#FFE294" font-size="14" >LEVELING UP</text><path d="M356 345v73" fill="none" stroke="#B9A4FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="356" cy="357" r="8" fill="#B9A4FF" /><text x="377" y="373" fill="#F4F7FF" font-size="21" font-weight="700">Cloud</text><text x="377" y="404" fill="#B9A4FF" font-size="14" >FUTURE QUEST</text><path d="M663 345v73" fill="none" stroke="#B9A4FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="663" cy="357" r="8" fill="#B9A4FF" /><text x="684" y="373" fill="#F4F7FF" font-size="21" font-weight="700">Mobile</text><text x="684" y="404" fill="#B9A4FF" font-size="14" >FUTURE QUEST</text></svg>