round" /><path d="M307 116h58.800000000000004M307 129h102.89999999999999M307 142h44.1" fill="none" stroke="#69DFEB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M307 155h82.32000000000001" fill="none" stroke="#B9A4FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="typing"/><g transform="translate(98 105) scale(1)"><g class="float"><rect x="0" y="0" width="82" height="57" rx="8" fill="#F4F7FF" /><rect x="9" y="9" width="63" height="11" rx="3" fill="#74A9FF" /><rect x="9" y="29" width="26" height="19" rx="3" fill="#B9A4FF" /><rect x="42" y="29" width="30" height="19" rx="3" fill="#82E2B5" /></g></g><g transform="translate(457 152) scale(1)"><g class="float late"><rect x="0" y="0" width="65" height="45" rx="8" fill="#F4F7FF" /><rect x="8" y="9" width="49" height="7" rx="2" fill="#69DFEB" /><rect x="8" y="25" width="32" height="10" rx="2" fill="#FFB078" /></g></g><path d="M260 207q55-60 100-20" fill="none" stroke="#FFE294" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/></svg>