<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">DEVELOPER TOOLBOX</title><desc id="desc">Original cartoon illustration. Decorative animation, not live telemetry.</desc><style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.mono{font-family:Consolas,Menlo,monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,40%,100%{opacity:1}60%,85%{opacity:.35}}
@keyframes travel{0%{stroke-dashoffset:80}100%{stroke-dashoffset:0}}
@keyframes steam{0%{opacity:0;transform:translateY(5px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}
@keyframes type{0%,12%{clip-path:inset(0 100% 0 0)}65%,100%{clip-path:inset(0 0 0 0)}}
@keyframes hand{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-4deg)}}
@keyframes bugwalk{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
.float{animation:float 6s ease-in-out infinite}.late{animation-delay:-3s}.led{animation:blink 5s ease-in-out infinite}
.flow{stroke-dasharray:7 18;animation:travel 8s linear infinite}.steam{animation:steam 5s ease-out infinite}
.typing{animation:type 14s steps(40) infinite}.hand{transform-origin:40px 0;animation:hand 1.8s ease-in-out infinite}
.bugwalk{animation:bugwalk 10s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.typing{clip-path:none!important}.steam{opacity:.5!important}}</style><rect x="0" y="0" width="600" height="360" rx="8" fill="#121B32" /><text x="28" y="38" fill="#FFB078" font-size="24" font-weight="700">DEVELOPER TOOLBOX</text><text x="28" y="66" fill="#BACAE4" font-size="16" >Everyday tools</text><path d="M92 219h414l-29 93H119Z" fill="#FFB078" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M219 220v-46h160v46" fill="none" stroke="#FFE294" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><rect x="82" y="115" width="100" height="67" rx="8" fill="#0B1224" stroke="#74A9FF" stroke-width="3"/><path d="M132 182v16m-22 0h44" fill="none" stroke="#BACAE4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M96 137h40M96 150h70M96 163h30" fill="none" stroke="#69DFEB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M96 176h56.00000000000001" fill="none" stroke="#B9A4FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="typing"/><rect x="397" y="120" width="62" height="80" rx="6" fill="#82E2B5" /><path d="M419 135v44M410 149h26" fill="none" stroke="#0B1224" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(298 161) scale(0.66)"><g class=""><path d="M-12 64v32h-16M14 64v32h17" fill="none" stroke="#0B1224" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" /><path d="M-20-2Q0-10 20-2l9 60q-27 15-57 0Z" fill="#FFB078" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M-5 5v18M6 5v18" fill="none" stroke="#F4F7FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-20 10l-6 28 35 5M20 10l17 22" fill="none" stroke="#E7AE8A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><circle cx="0" cy="-36" r="25" fill="#F1C29F" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M-25-32q-7-36