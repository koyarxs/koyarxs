"2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-20 10l-8 22 26 4M20 10l16 20 14-4" fill="none" stroke="#E7AE8A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><circle cx="0" cy="-36" r="25" fill="#F1C29F" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M-25-32q-7-36 28-33 27 1 22 31L12-46l-15 6-19-3Z" fill="#0B1224"/><circle cx="-8" cy="-33" r="2.5" fill="#0B1224" /><circle cx="9" cy="-33" r="2.5" fill="#0B1224" /><path d="M-5-21q6 5 12-1" fill="none" stroke="#0B1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="26" y="11" width="26" height="28" rx="5" fill="#FFE294" /><path d="M51 16q18 0 8 18h-7" fill="none" stroke="#FFE294" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g></g><circle cx="265" cy="169" r="11" fill="#FFE294" class="led"/><circle cx="379" cy="227" r="10" fill="#F4A8CD" /><path d="M73 293h456" fill="none" stroke="#F4F7FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/><text x="477" y="283" fill="#F4F7FF" font-size="19" >main</text><text x="316" y="84" fill="#69DFEB" font-size="18" >feature/*</text></svg>