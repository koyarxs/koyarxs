circle cx="188" cy="200" r="3" fill="#82E2B5" class="led"/><rect x="155" y="216" width="40" height="16" rx="3" fill="#0B1224" /><circle cx="188" cy="224" r="3" fill="#82E2B5" class="led"/><rect x="155" y="240" width="40" height="16" rx="3" fill="#0B1224" /><circle cx="188" cy="248" r="3" fill="#82E2B5" class="led"/><g transform="translate(425 206) scale(1)"><g class=""><path d="M-36 0v63q36 24 72 0V0" fill="#82E2B5" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><ellipse rx="36" ry="12" fill="#F4F7FF" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M-35 22q35 21 70 0M-35 43q35 21 70 0" fill="none" stroke="#0B1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g><path d="M114 110q182-96 364 0" fill="none" stroke="#82E2B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(63 278) scale(0.7)"><g class="bugwalk"><path d="M-10-7l-9-6M10-7l9-6M-12 1h-10M12 1h10M-10 9l-9 7M10 9l9 7" fill="none" stroke="#F4A8CD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><ellipse rx="13" ry="17" fill="#F4A8CD" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M0-11v23" fill="none" stroke="#0B1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-5" cy="-8" r="2" fill="#0B1224" /><circle cx="5" cy="-8" r="2" fill="#0B1224" /></g></g><text x="259" y="303" fill="#F4F7FF" font-size="17" >AUTH</text><circle cx="383" cy="133" r="6" fill="#FFE294" class="led"/></svg>