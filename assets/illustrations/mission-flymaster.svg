inejoin="round" /><path d="M-20 10l-8 22 26 4M20 10l16 20 14-4" fill="none" stroke="#E7AE8A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><circle cx="0" cy="-36" r="25" fill="#F1C29F" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M-25-32q-7-36 28-33 27 1 22 31L12-46l-15 6-19-3Z" fill="#0B1224"/><circle cx="-8" cy="-33" r="2.5" fill="#0B1224" /><circle cx="9" cy="-33" r="2.5" fill="#0B1224" /><path d="M-5-21q6 5 12-1" fill="none" stroke="#0B1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="21" y="-1" width="26" height="44" rx="5" fill="#0B1224" /><rect x="25" y="4" width="18" height="29" rx="2" fill="#69DFEB" /><circle cx="34" cy="38" r="2" fill="#F4F7FF" /></g></g><g transform="translate(490 250) scale(1)"><g class=""><path d="M-36 0v63q36 24 72 0V0" fill="#82E2B5" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><ellipse rx="36" ry="12" fill="#F4F7FF" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M-35 22q35 21 70 0M-35 43q35 21 70 0" fill="none" stroke="#0B1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g><path d="M243 205h66M369 243h95" fill="none" stroke="#69DFEB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/><rect x="353" y="225" width="52" height="92" rx="6" fill="#202C49" stroke="#74A9FF" stroke-width="2"/><rect x="359" y="239" width="40" height="16" rx="3" fill="#0B1224" /><circle cx="392" cy="247" r="3" fill="#82E2B5" class="led"/><rect x="359" y="263" width="40" height="16" rx="3" fill="#0B1224" /><circle cx="392" cy="271" r="3" fill="#82E2B5" class="led"/><rect x="359" y="287" width="40" height="16" rx="3" fill="#0B1224" /><circle cx="392" cy="295" r="3" fill="#82E2B5" class="led"/></svg>