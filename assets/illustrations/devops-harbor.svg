<circle cx="-8" cy="-33" r="2.5" fill="#0B1224" /><circle cx="9" cy="-33" r="2.5" fill="#0B1224" /><path d="M-5-21q6 5 12-1" fill="none" stroke="#0B1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="17" y="15" width="50" height="38" rx="8" fill="#FFE294" /><path d="M26 24h29M26 34h16M26 43h27" fill="none" stroke="#0B1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g><g transform="translate(483 222) scale(0.7)"><g class="float"><path d="M-9 18l-7 9M9 18l7 9" fill="none" stroke="#0B1224" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-20" y="-15" width="40" height="37" rx="8" fill="#82E2B5" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M0-15v-9" fill="none" stroke="#82E2B5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="0" cy="-26" r="4" fill="#FFE294" /><rect x="-14" y="-8" width="28" height="14" rx="5" fill="#0B1224" /><circle cx="-7" cy="-1" r="3" fill="#69DFEB" /><circle cx="7" cy="-1" r="3" fill="#69DFEB" /><path d="M-5 12h10" fill="none" stroke="#0B1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="285" y="157" fill="#0B1224" font-size="18" text-anchor="middle" font-weight="700">CI / CD</text></svg>