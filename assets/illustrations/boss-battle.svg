<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350" role="img" aria-labelledby="title desc"><title id="title">Bug boss battle / debugging practice</title><desc id="desc">Original cartoon illustration. Decorative animation, not live telemetry.</desc><style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.mono{font-family:Consolas,Menlo,monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,40%,100%{opacity:1}60%,85%{opacity:.35}}
@keyframes travel{0%{stroke-dashoffset:80}100%{stroke-dashoffset:0}}
@keyframes steam{0%{opacity:0;transform:translateY(5px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}
@keyframes type{0%,12%{clip-path:inset(0 100% 0 0)}65%,100%{clip-path:inset(0 0 0 0)}}
@keyframes hand{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-4deg)}}
@keyframes bugwalk{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
.float{animation:float 6s ease-in-out infinite}.late{animation-delay:-3s}.led{animation:blink 5s ease-in-out infinite}
.flow{stroke-dasharray:7 18;animation:travel 8s linear infinite}.steam{animation:steam 5s ease-out infinite}
.typing{animation:type 14s steps(40) infinite}.hand{transform-origin:40px 0;animation:hand 1.8s ease-in-out infinite}
.bugwalk{animation:bugwalk 10s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.typing{clip-path:none!important}.steam{opacity:.5!important}}</style><rect x="0" y="0" width="600" height="350" rx="8" fill="#121B32" /><text x="28" y="38" fill="#69DFEB" font-size="24" font-weight="700">BOSS BATTLES</text><text x="28" y="69" fill="#BACAE4" font-size="20" >Every bug is just another boss fight.</text><g transform="translate(163 228) scale(1)"><g class=""><path d="M-12 64v32h-16M14 64v32h17" fill="none" stroke="#0B1224" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" /><path d="M-20-2Q0-10 20-2l9 60q-27 15-57 0Z" fill="#74A9FF" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M-5 5v18M6 5v18" fill="none" stroke="#F4F7FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-20 10l-8 22 26 4M20 10l16 20 14-4" fill="none" stroke="#E7AE8A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><circle cx="0" cy="-36" r="25" fill="#F1C29F" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M-25-32q-7-36 28-33 27 1 22 31L12-46l-15 6-19-3Z" fill="#0B1224"/><circle cx="-8" cy="-33" r="2.5" fill="#0B1224" /><circle cx="9" cy="-33" r="2.5" fill="#0B1224" /><path d="M-5-21q6 5 12-1" fill="none" stroke="#0B1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M25 5l24 28" fill="none" stroke="#FFE294" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="27" cy="5" r="17" fill="none" stroke="#FFE294" stroke-width="5"/><circle cx="27" cy="5" r="10" fill="#69DFEB" /></g></g><g transform="translate(442 220) scale(2)"><g class="bugwalk"><path d="M-10-7l-9-6M10-7l9-6M-12 1h-10M12 1h10M-10 9l-9 7M10 9l9 7" fill="none" stroke="#F4A8CD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><ellipse rx="13" ry="17" fill="#F4A8CD" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M0-11v23" fill="none" stroke="#0B1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-5" cy="-8" r="2" fill="#0B1224" /><circle cx="5" cy="-8" r="2" fill="#0B1224" /></g></g><path d="M234 210h124" fill="none" stroke="#69DFEB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="flow"/><text x="272" y="194" fill="#82E2B5" font-size="18" >TESTS</text><text x="261" y="237" fill="#FFE294" font-size="18" >LOGS</text><text x="237" y="277" fill="#74A9FF" font-size="18" >DEBUGGER</text><text x="28" y="328" fill="#BACAE4" font-size="16" >Unexpected bugs · dependency conflicts · merge conflicts</text></svg>