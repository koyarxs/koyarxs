<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">ARCHITECTURE CITY</title><desc id="desc">Original cartoon illustration. Decorative animation, not live telemetry.</desc><style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.mono{font-family:Consolas,Menlo,monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,40%,100%{opacity:1}60%,85%{opacity:.35}}
@keyframes travel{0%{stroke-dashoffset:80}100%{stroke-dashoffset:0}}
@keyframes steam{0%{opacity:0;transform:translateY(5px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}
@keyframes type{0%,12%{clip-path:inset(0 100% 0 0)}65%,100%{clip-path:inset(0 0 0 0)}}
@keyframes hand{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-4deg)}}
@keyframes bugwalk{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
.float{animation:float 6s ease-in-out infinite}.late{animation-delay:-3s}.led{animation:blink 5s ease-in-out infinite}
.flow{stroke-dasharray:7 18;animation:travel 8s linear infinite}.steam{animation:steam 5s ease-out infinite}
.typing{animation:type 14s steps(40) infinite}.hand{transform-origin:40px 0;animation:hand 1.8s ease-in-out infinite}
.bugwalk{animation:bugwalk 10s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.typing{clip-path:none!important}.steam{opacity:.5!important}}</style><rect x="0" y="0" width="600" height="360" rx="8" fill="#121B32" /><text x="28" y="38" fill="#FFE294" font-size="24" font-weight="700">ARCHITECTURE CITY</text><text x="28" y="66" fill="#BACAE4" font-size="16" >Leveling up</text><path d="M37 283l246-67 272 69-244 64Z" fill="#41536D" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><rect x="83" y="164" width="82" height="118" rx="8" fill="#74A9FF" /><rect x="220" y="103" width="92" height="160" rx="8" fill="#82E2B5" /><rect x="377" y="164" width="85" height="120" rx="8" fill="#B9A4FF" /><path d="M165 202h55M312 202h65" fill="none" stroke="#FFE294" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><path d="M479 277V64h-173M480 64l-72 64M350 64v80" fill="none" stroke="#FFB078" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(324 268) scale(0.75)"><g class=""><path d="M-12 64v32h-16M14 64v32h17" fill="none" stroke="#0B1224" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" /><path d="M-20-2Q0-10 20-2l9 60q-27 15-57 0Z" fill="#FFE294" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M-5 5v18M6 5v18" fill="none" stroke="#F4F7FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-20 10l-6 28 35 5M20 10l17 22" fill="none" stroke="#E7AE8A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><circle cx="0" cy="-36" r="25" fill="#F1C29F" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M-25-32q-7-36 28-33 27 1 22 31L12-46l-15 6-19-3Z" fill="#0B1224"/><circle cx="-8" cy="-33" r="2.5" fill="#0B1224" /><circle cx="9" cy="-33" r="2.5" fill="#0B1224" /><path d="M-5-21q6 5 12-1" fill="none" stroke="#0B1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="17" y="15" width="50" height="38" rx="8" fill="#FFE294" /><path d="M26 24h29M26 34h16M26 43h27" fill="none" stroke="#0B1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g><rect x="103" y="185" width="29" height="38" rx="3" fill="#0B1224" /><rect x="239" y="185" width="29" height="38" rx="3" fill="#0B1224" /><rect x="399" y="185" width="29" height="38" rx="3" fill="#0B1224" /><text x="112" y="153" fill="#F4F7FF" font-size="18" >UI</text><text x="244" y="91" fill="#F4F7FF" font-size="18" >API</text><text x="388" y="152" fill="#F4F7FF" font-size="18" >DATA</text></svg>