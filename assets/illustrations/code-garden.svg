<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" role="img" aria-labelledby="title desc"><title id="title">Garden decoration / actual contribution graph is separate</title><desc id="desc">Original cartoon illustration. Decorative animation, not live telemetry.</desc><style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.mono{font-family:Consolas,Menlo,monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,40%,100%{opacity:1}60%,85%{opacity:.35}}
@keyframes travel{0%{stroke-dashoffset:80}100%{stroke-dashoffset:0}}
@keyframes steam{0%{opacity:0;transform:translateY(5px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}
@keyframes type{0%,12%{clip-path:inset(0 100% 0 0)}65%,100%{clip-path:inset(0 0 0 0)}}
@keyframes hand{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-4deg)}}
@keyframes bugwalk{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
.float{animation:float 6s ease-in-out infinite}.late{animation-delay:-3s}.led{animation:blink 5s ease-in-out infinite}
.flow{stroke-dasharray:7 18;animation:travel 8s linear infinite}.steam{animation:steam 5s ease-out infinite}
.typing{animation:type 14s steps(40) infinite}.hand{transform-origin:40px 0;animation:hand 1.8s ease-in-out infinite}
.bugwalk{animation:bugwalk 10s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.typing{clip-path:none!important}.steam{opacity:.5!important}}</style><rect x="0" y="0" width="600" height="200" rx="8" fill="#121B32" /><text x="28" y="38" fill="#69DFEB" font-size="24" font-weight="700">CODE GARDEN</text><text x="28" y="71" fill="#BACAE4" font-size="20" >Every contribution is a little growth.</text><path d="M30 169h540" fill="none" stroke="#82E2B5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M67 169v-24" fill="none" stroke="#82E2B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M67 145q-27-34-31-10t31 17q29-32 31-8t-31 1" fill="#82E2B5" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M139 169v-39" fill="none" stroke="#82E2B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M139 130q-27-34-31-10t31 17q29-32 31-8t-31 1" fill="#82E2B5" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M211 169v-54" fill="none" stroke="#82E2B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M211 115q-27-34-31-10t31 17q29-32 31-8t-31 1" fill="#82E2B5" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M386 169v-24" fill="none" stroke="#82E2B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M386 145q-27-34-31-10t31 17q29-32 31-8t-31 1" fill="#82E2B5" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M470 169v-39" fill="none" stroke="#82E2B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M470 130q-27-34-31-10t31 17q29-32 31-8t-31 1" fill="#82E2B5" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M531 169v-54" fill="none" stroke="#82E2B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M531 115q-27-34-31-10t31 17q29-32 31-8t-31 1" fill="#82E2B5" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><g transform="translate(294 140) scale(0.7)"><g class="float"><path d="M-9 18l-7 9M9 18l7 9" fill="none" stroke="#0B1224" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-20" y="-15" width="40" height="37" rx="8" fill="#82E2B5" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M0-15v-9" fill="none" stroke="#82E2B5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="0" cy="-26" r="4" fill="#FFE294" /><rect x="-14" y="-8" width="28" height="14" rx="5" fill="#0B1224" /><circle cx="-7" cy="-1" r="3" fill="#69DFEB" /><circle cx="7" cy="-1" r="3" fill="#69DFEB" /><path d="M-5 12h10" fill="none" stroke="#0B1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g></svg>