troke-linecap="round" stroke-linejoin="round" class="typing"/><g transform="translate(489 248) scale(0.82)"><g class="float"><path d="M-9 18l-7 9M9 18l7 9" fill="none" stroke="#0B1224" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-20" y="-15" width="40" height="37" rx="8" fill="#82E2B5" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M0-15v-9" fill="none" stroke="#82E2B5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="0" cy="-26" r="4" fill="#FFE294" /><rect x="-14" y="-8" width="28" height="14" rx="5" fill="#0B1224" /><circle cx="-7" cy="-1" r="3" fill="#69DFEB" /><circle cx="7" cy="-1" r="3" fill="#69DFEB" /><path d="M-5 12h10" fill="none" stroke="#0B1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g><circle cx="123" cy="270" r="9" fill="#F4A8CD" /><circle cx="164" cy="270" r="9" fill="#F4A8CD" /><circle cx="205" cy="270" r="9" fill="#F4A8CD" /><circle cx="164" cy="301" r="20" fill="#F4A8CD" /><text x="32" y="327" fill="#BACAE4" font-size="18" >Frontend started / Full Stack planned</text></svg>