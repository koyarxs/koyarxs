<svg xmlns="http://www.w3.org/2000/svg" width="600" height="370" viewBox="0 0 600 370" role="img" aria-labelledby="title desc"><title id="title">GAMING / RESPAWN</title><desc id="desc">Original cartoon illustration. Decorative animation, not live telemetry.</desc><style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.mono{font-family:Consolas,Menlo,monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,40%,100%{opacity:1}60%,85%{opacity:.35}}
@keyframes travel{0%{stroke-dashoffset:80}100%{stroke-dashoffset:0}}
@keyframes steam{0%{opacity:0;transform:translateY(5px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}
@keyframes type{0%,12%{clip-path:inset(0 100% 0 0)}65%,100%{clip-path:inset(0 0 0 0)}}
@keyframes hand{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-4deg)}}
@keyframes bugwalk{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
.float{animation:float 6s ease-in-out infinite}.late{animation-delay:-3s}.led{animation:blink 5s ease-in-out infinite}
.flow{stroke-dasharray:7 18;animation:travel 8s linear infinite}.steam{animation:steam 5s ease-out infinite}
.typing{animation:type 14s steps(40) infinite}.hand{transform-origin:40px 0;animation:hand 1.8s ease-in-out infinite}
.bugwalk{animation:bugwalk 10s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.typing{clip-path:none!important}.steam{opacity:.5!important}}</style><rect x="0" y="0" width="600" height="370" rx="8" fill="#121B32" /><text x="28" y="38" fill="#69DFEB" font-size="24" font-weight="700">GAMING / RESPAWN</text><text x="28" y="69" fill="#BACAE4" font-size="18" >Gaming sometimes — even developers need to respawn.</text><rect x="315" y="101" width="177" height="112" rx="8" fill="#0B1224" stroke="#74A9FF" stroke-width="3"/><path d="M403.5 213v16m-22 0h44" fill="none" stroke="#BACAE4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M329 123h70.8M329 136h123.89999999999999M329 149h53.1" fill="none" stroke="#69DFEB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M329 162h99.12" fill="none" stroke="#B9A4FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="typing"/><rect x="60" y="236" width="479" height="12" rx="3" fill="#B9A4FF" /><g transform="translate(210 225) scale(0.94)"><g class=""><path d="M-17 61l-16 28h30M15 62l25 26h18" fill="none" stroke="#0B1224" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" /><path d="M-20-2Q0-10 20-2l9 60q-27 15-57 0Z" fill="#B9A4FF" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M-5 5v18M6 5v18" fill="none" stroke="#F4F7FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-20 10l-8 22 26 4M20 10l16 20 14-4" fill="none" stroke="#E7AE8A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><circle cx="0" cy="-36" r="25" fill="#F1C29F" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M-25-32q-7-36 28-33 27 1 22 31L12-46l-15 6-19-3Z" fill="#0B1224"/><circle cx="-8" cy="-33" r="2.5" fill="#0B1224" /><circle cx="9" cy="-33" r="2.5" fill="#0B1224" /><path d="M-5-21q6 5 12-1" fill="none" stroke="#0B1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="7" y="16" width="50" height="24" rx="8" fill="#0B1224" /><path d="M17 22v12m-6-6h12" fill="none" stroke="#69DFEB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="43" cy="24" r="3" fill="#F4A8CD" /><circle cx="49" cy="30" r="3" fill="#FFE294" /></g></g><rect x="475" y="261" width="10" height="10" rx="0" fill="#69DFEB" /><rect x="489" y="251" width="10" height="10" rx="0" fill="#FFE294" /><rect x="503" y="271" width="10" height="10" rx="0" fill="#F4A8CD" /><text x="30" y="347" fill="#BACAE4" font-size="17" >Recharge is part of the process.</text></svg>