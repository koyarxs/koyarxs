h d="M369 201v25" fill="none" stroke="#BACAE4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(447 271) scale(1)"><g class="bugwalk"><path d="M-10-7l-9-6M10-7l9-6M-12 1h-10M12 1h10M-10 9l-9 7M10 9l9 7" fill="none" stroke="#F4A8CD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><ellipse rx="13" ry="17" fill="#F4A8CD" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M0-11v23" fill="none" stroke="#0B1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-5" cy="-8" r="2" fill="#0B1224" /><circle cx="5" cy="-8" r="2" fill="#0B1224" /></g></g><g transform="translate(250 284) scale(0.65)"><g class=""><path d="M-9 18l-7 9M9 18l7 9" fill="none" stroke="#0B1224" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-20" y="-15" width="40" height="37" rx="8" fill="#82E2B5" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M0-15v-9" fill="none" stroke="#82E2B5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="0" cy="-26" r="4" fill="#FFE294" /><rect x="-14" y="-8" width="28" height="14" rx="5" fill="#0B1224" /><circle cx="-7" cy="-1" r="3" fill="#69DFEB" /><circle cx="7" cy="-1" r="3" fill="#69DFEB" /><path d="M-5 12h10" fill="none" stroke="#0B1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g><path d="M328 212v-36m-10 0h20M310 212q26 25 49 0" fill="none" stroke="#69DFEB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="333" cy="210" r="7" fill="#FFE294" class="led"/></svg>