<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc"><title id="title">MOBILE LAB</title><desc id="desc">Original cartoon illustration. Decorative animation, not live telemetry.</desc><style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.mono{font-family:Consolas,Menlo,monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,40%,100%{opacity:1}60%,85%{opacity:.35}}
@keyframes travel{0%{stroke-dashoffset:80}100%{stroke-dashoffset:0}}
@keyframes steam{0%{opacity:0;transform:translateY(5px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}
@keyframes type{0%,12%{clip-path:inset(0 100% 0 0)}65%,100%{clip-path:inset(0 0 0 0)}}
@keyframes hand{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-4deg)}}
@keyframes bugwalk{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
.float{animation:float 6s ease-in-out infinite}.late{animation-delay:-3s}.led{animation:blink 5s ease-in-out infinite}
.flow{stroke-dasharray:7 18;animation:travel 8s linear infinite}.steam{animation:steam 5s ease-out infinite}
.typing{animation:type 14s steps(40) infinite}.hand{transform-origin:40px 0;animation:hand 1.8s ease-in-out infinite}
.bugwalk{animation:bugwalk 10s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.typing{clip-path:none!important}.steam{opacity:.5!important}}</style><rect x="0" y="0" width="600" height="360" rx="8" fill="#121B32" /><text x="28" y="38" fill="#F4A8CD" font-size="24" font-weight="700">MOBILE LAB</text><text x="28" y="66" fill="#BACAE4" font-size="16" >Future quest</text><rect x="310" y="70" width="139" height="253" rx="20" fill="#0B1224" stroke="#F4A8CD" stroke-width="4"/><rect x="320" y="90" width="119" height="206" rx="12" fill="#344566" /><rect x="331" y="118" width="97" height="48" rx="8" fill="#69DFEB" /><rect x="331" y="181" width="43" height="51" rx="8" fill="#B9A4FF" /><rect x="384" y="181" width="43" height="51" rx="8" fill="#82E2B5" /><rect x="331" y="248" width="97" height="25" rx="8" fill="#FFB078" /><circle cx="379" cy="309" r="5" fill="#F4A8CD" /><g transform="translate(177 231) scale(0.9)"><g class=""><path d="M-12 64v32h-16M14 64v32h17" fill="none" stroke="#0B1224" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" /><path d="M-20-2Q0-10 20-2l9 60q-27 15-57 0Z" fill="#F4A8CD" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M-5 5v18M6 5v18" fill="none" stroke="#F4F7FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-20 10l-8 22 26 4M20 10l16 20 14-4" fill="none" stroke="#E7AE8A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><circle cx="0" cy="-36" r="25" fill="#F1C29F" stroke="#0B1224" stroke-width="3" stroke-linejoin="round"/><path d="M-25-32q-7-36 28-33 27 1 22 31L12-46l-15 6-19-3Z" fill="#0B1224"/><circle cx="-8" cy="-33" r="2.5" fill="#0B1224" /><circle cx="9" cy="-33" r="2.5" fill="#0B1224" /><path d="M-5-21q6 5 12-1" fill="none" stroke="#0B1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="21" y="-1" width="26" height="44" rx="5" fill="#0B1224" /><rect x="25" y="4" width="18" height="29" rx="2" fill="#69DFEB" /><circle cx="34" cy="38" r="2" fill="#F4F7FF" /></g></g><g transform="translate(451 110) scale(1)"><g class="float"><rect x="0" y="0" width="89" height="42" rx="8" fill="#F4F7FF" /><circle cx="14" cy="21" r="5" fill="#82E2B5" /><path d="M27 16h48M27 26h31" fill="none" stroke="#0B1224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g><path d="M103 299h188" fill="none" stroke="#74A9FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg>