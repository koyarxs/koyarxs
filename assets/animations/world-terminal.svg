<svg xmlns="http://www.w3.org/2000/svg" width="600" height="476" viewBox="0 0 600 476" role="img" aria-labelledby="title desc"><title id="title">Terminal / fictional presentation, not a running shell</title><desc id="desc">Original cartoon illustration. Decorative animation, not live telemetry.</desc><style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.mono{font-family:Consolas,Menlo,monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,40%,100%{opacity:1}60%,85%{opacity:.35}}
@keyframes travel{0%{stroke-dashoffset:80}100%{stroke-dashoffset:0}}
@keyframes steam{0%{opacity:0;transform:translateY(5px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}
@keyframes type{0%,12%{clip-path:inset(0 100% 0 0)}65%,100%{clip-path:inset(0 0 0 0)}}
@keyframes hand{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-4deg)}}
@keyframes bugwalk{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
.float{animation:float 6s ease-in-out infinite}.late{animation-delay:-3s}.led{animation:blink 5s ease-in-out infinite}
.flow{stroke-dasharray:7 18;animation:travel 8s linear infinite}.steam{animation:steam 5s ease-out infinite}
.typing{animation:type 14s steps(40) infinite}.hand{transform-origin:40px 0;animation:hand 1.8s ease-in-out infinite}
.bugwalk{animation:bugwalk 10s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.typing{clip-path:none!important}.steam{opacity:.5!important}}</style><rect x="0" y="0" width="600" height="476" rx="8" fill="#121B32" /><style>@keyframes terminal0{0%,0%{opacity:0;clip-path:inset(0 100% 0 0)}1%{opacity:1}8%,100%{opacity:1;clip-path:inset(0 0 0 0)}}.terminal0{animation:terminal0 24s steps(42) infinite}@media(prefers-reduced-motion:reduce){.terminal0{opacity:1!important;clip-path:none!important}}@keyframes terminal1{0%,10%{opacity:0;clip-path:inset(0 100% 0 0)}11%{opacity:1}18%,100%{opacity:1;clip-path:inset(0 0 0 0)}}.terminal1{animation:terminal1 24s steps(42) infinite}@media(prefers-reduced-motion:reduce){.terminal1{opacity:1!important;clip-path:none!important}}@keyframes terminal2{0%,20%{opacity:0;clip-path:inset(0 100% 0 0)}21%{opacity:1}28%,100%{opacity:1;clip-path:inset(0 0 0 0)}}.terminal2{animation:terminal2 24s steps(42) infinite}@media(prefers-reduced-motion:reduce){.terminal2{opacity:1!important;clip-path:none!important}}@keyframes terminal3{0%,30%{opacity:0;clip-path:inset(0 100% 0 0)}31%{opacity:1}38%,100%{opacity:1;clip-path:inset(0 0 0 0)}}.terminal3{animation:terminal3 24s steps(42) infinite}@media(prefers-reduced-motion:reduce){.terminal3{opacity:1!important;clip-path:none!important}}@keyframes terminal4{0%,40%{opacity:0;clip-path:inset(0 100% 0 0)}41%{opacity:1}48%,100%{opacity:1;clip-path:inset(0 0 0 0)}}.terminal4{animation:terminal4 24s steps(42) infinite}@media(prefers-reduced-motion:reduce){.terminal4{opacity:1!important;clip-path:none!important}}@keyframes terminal5{0%,50%{opacity:0;clip-path:inset(0 100% 0 0)}51%{opacity:1}58%,100%{opacity:1;clip-path:inset(0 0 0 0)}}.terminal5{animation:terminal5 24s steps(42) infinite}@media(prefers-reduced-motion:reduce){.terminal5{opacity:1!important;clip-path:none!important}}</style><text x="28" y="35" fill="#69DFEB" font-size="24" font-weight="700">yerko@dev:~</text><g class="terminal0"><text x="25" y="77" fill="#82E2B5" font-size="18" class="mono">$ whoami</text><text x="25" y="102" fill="#F4F7FF" font-size="19" class="mono">Yerko Barrera</text></g><g class="terminal1"><text x="25" y="142" fill="#82E2B5" font-size="18" class="mono">$ education</text><text x="25" y="167" fill="#F4F7FF" font-size="19" class="mono">Computer &amp; Informatics Engineer</text></g><g class="terminal2"><text x="25" y="207" fill="#82E2B5" font-size="18" class="mono">$ role</text><text x="25" y="232" fill="#F4F7FF" font-size="19" class="mono">Software Engineer / Full Stack Developer</text></g><g class="terminal3"><text x="25" y="272" fill="#82E2B5" font-size="18" class="mono">$ current_mission</text><text x="25" y="297" fill="#F4F7FF" font-size="19" class="mono">Build. Learn. Improve.</text></g><g class="terminal4"><text x="25" y="337" fill="#82E2B5" font-size="18" class="mono">$ location</text><text x="25" y="362" fill="#F4F7FF" font-size="19" class="mono">Chile</text></g><g class="terminal5"><text x="25" y="402" fill="#82E2B5" font-size="18" class="mono">$ status</text><text x="25" y="427" fill="#F4F7FF" font-size="19" class="mono">Ready to code</text></g><text x="25" y="455" fill="#69DFEB" font-size="23" class="mono led">_</text></svg>