<svg xmlns="http://www.w3.org/2000/svg" width="980" height="224" viewBox="0 0 980 224" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.mono{font-family:Consolas,Menlo,monospace}@keyframes progress{from{transform:translateX(-120px)}to{transform:translateX(430px)}}.moving{animation:progress 6s linear infinite}.delayed{animation-delay:-3s}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="980" height="224" rx="8" fill="#101316"/><text x="36" y="41" font-size="20" fill="#84BFFF" class="mono">$ current_work</text><text x="36" y="98" font-size="24" fill="#F0F3F6" font-weight="700">FlyMaster</text><text x="36" y="128" font-size="15" fill="#A4B0BB" >Full Stack platform / preparing deployment</text><text x="530" y="98" font-size="24" fill="#F0F3F6" font-weight="700">Pawly</text><text x="530" y="128" font-size="15" fill="#A4B0BB" >Early stage / planning the next iteration</text><defs><clipPath id="progressA"><rect x="36" y="153" width="412" height="4"/></clipPath><clipPath id="progressB"><rect x="530" y="153" width="412" height="4"/></clipPath></defs><path d="M36 155h412M530 155h412" stroke="#303942" stroke-width="4"/><g clip-path="url(#progressA)"><rect class="moving" x="36" y="153" width="110" height="4" fill="#83D4BE"/></g><g clip-path="url(#progressB)"><rect class="moving delayed" x="530" y="153" width="110" height="4" fill="#EAC184"/></g><text x="36" y="195" font-size="12" fill="#A4B0BB" >Work in progress / no completion percentages</text></svg>