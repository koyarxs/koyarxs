<svg xmlns="http://www.w3.org/2000/svg" width="980" height="443" viewBox="0 0 980 443" role="img" aria-labelledby="title desc"><title id="title">Development workflow / illustrative process</title><desc id="desc">Original cartoon illustration. Decorative animation, not live telemetry.</desc><style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.mono{font-family:Consolas,Menlo,monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,40%,100%{opacity:1}60%,85%{opacity:.35}}
@keyframes travel{0%{stroke-dashoffset:80}100%{stroke-dashoffset:0}}
@keyframes steam{0%{opacity:0;transform:translateY(5px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}
@keyframes type{0%,12%{clip-path:inset(0 100% 0 0)}65%,100%{clip-path:inset(0 0 0 0)}}
@keyframes hand{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-4deg)}}
@keyframes bugwalk{0%,100%{transform:translateX(0)}50%{transform:translateX(16px)}}
.float{animation:float 6s ease-in-out infinite}.late{animation-delay:-3s}.led{animation:blink 5s ease-in-out infinite}
.flow{stroke-dasharray:7 18;animation:travel 8s linear infinite}.steam{animation:steam 5s ease-out infinite}
.typing{animation:type 14s steps(40) infinite}.hand{transform-origin:40px 0;animation:hand 1.8s ease-in-out infinite}
.bugwalk{animation:bugwalk 10s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.typing{clip-path:none!important}.steam{opacity:.5!important}}</style><rect x="0" y="0" width="980" height="443" rx="8" fill="#121B32" /><text x="28" y="38" fill="#69DFEB" font-size="24" font-weight="700">HOW I BUILD SOFTWARE</text><text x="28" y="68" fill="#BACAE4" font-size="19" >A practice to keep improving, not a claim of perfect process.</text><circle cx="50" cy="125" r="17" fill="#69DFEB" /><path d="M43 125l6 6 10-12" fill="none" stroke="#0B1224" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="76" y="133" fill="#F4F7FF" font-size="20" >Idea</text><path d="M51 151v33" fill="none" stroke="#74A9FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/><circle cx="360" cy="125" r="17" fill="#82E2B5" /><path d="M353 125l6 6 10-12" fill="none" stroke="#0B1224" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="386" y="133" fill="#F4F7FF" font-size="20" >Planning / Jira</text><path d="M361 151v33" fill="none" stroke="#74A9FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/><circle cx="670" cy="125" r="17" fill="#FFE294" /><path d="M663 125l6 6 10-12" fill="none" stroke="#0B1224" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="696" y="133" fill="#F4F7FF" font-size="20" >Feature branch</text><path d="M671 151v33" fill="none" stroke="#74A9FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/><circle cx="50" cy="228" r="17" fill="#69DFEB" /><path d="M43 228l6 6 10-12" fill="none" stroke="#0B1224" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="76" y="236" fill="#F4F7FF" font-size="20" >Development</text><path d="M51 254v33" fill="none" stroke="#74A9FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/><circle cx="360" cy="228" r="17" fill="#82E2B5" /><path d="M353 228l6 6 10-12" fill="none" stroke="#0B1224" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="386" y="236" fill="#F4F7FF" font-size="20" >Testing</text><path d="M361 254v33" fill="none" stroke="#74A9FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/><circle cx="670" cy="228" r="17" fill="#FFE294" /><path d="M663 228l6 6 10-12" fill="none" stroke="#0B1224" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="696" y="236" fill="#F4F7FF" font-size="20" >Pull request</text><path d="M671 254v33" fill="none" stroke="#74A9FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/><circle cx="50" cy="331" r="17" fill="#69DFEB" /><path d="M43 331l6 6 10-12" fill="none" stroke="#0B1224" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="76" y="339" fill="#F4F7FF" font-size="20" >Code review</text><path d="M51 357v33" fill="none" stroke="#74A9FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/><circle cx="360" cy="331" r="17" fill="#82E2B5" /><path d="M353 331l6 6 10-12" fill="none" stroke="#0B1224" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="386" y="339" fill="#F4F7FF" font-size="20" >CI/CD</text><path d="M361 357v33" fill="none" stroke="#74A9FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/><circle cx="670" cy="331" r="17" fill="#FFE294" /><path d="M663 331l6 6 10-12" fill="none" stroke="#0B1224" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="696" y="339" fill="#F4F7FF" font-size="20" >Deployment</text><path d="M671 357v33" fill="none" stroke="#74A9FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/></svg>