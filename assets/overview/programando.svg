<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-labelledby="title desc">
  <title id="title">Yerko programando</title>
  <desc id="desc">Ilustración de un desarrollador escribiendo en su notebook. Las manos, las líneas de código y el cursor se animan en bucle.</desc>
  <defs>
    <linearGradient id="room" x2="1" y2="1"><stop stop-color="#071a31"/><stop offset="1" stop-color="#123e69"/></linearGradient>
    <linearGradient id="hoodie" x2="0" y2="1"><stop stop-color="#2583bd"/><stop offset="1" stop-color="#133c67"/></linearGradient>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .hand { animation: tap .62s ease-in-out infinite alternate; }
      .hand-right { animation-delay: -.35s; }
      .line { transform-box: fill-box; transform-origin: left; animation: write 6s steps(9, end) infinite; }
      .line-two { animation-delay: -.6s; }
      .line-three { animation-delay: -1.3s; }
      .caret { animation: blink 1s steps(1, end) infinite; }
    }
    @keyframes tap { to { transform: translateY(-3px); } }
    @keyframes write { 0% { transform: scaleX(.14); } 66%, 100% { transform: scaleX(1); } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="760" height="250" rx="20" fill="url(#room)"/>
