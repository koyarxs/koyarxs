<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc">
  <title id="title">Trayectoria y formación</title>
  <desc id="desc">Cinco experiencias profesionales y formación en la Universidad Andrés Bello y AIEP. El detalle está disponible como texto debajo.</desc>
  <defs>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#0b2343"/><stop offset="1" stop-color="#102f52"/></linearGradient>
  </defs>
  <style>
    text { font-family:system-ui,sans-serif; }
    .title { font-size:32px;font-weight:750;fill:#f3f8ff; }
    .body { font-size:15px;fill:#cedfee; }
    .meta { font-size:15px;fill:#b5d1ea; }
    .name { font-size:18px;font-weight:720;fill:#f3f8ff; }
    .accent { font-size:17px;font-weight:700;fill:#ffc177; }
    .tile { fill:#142f4e;stroke:#345a7d; }
    .pulse { fill:#ffc177; }
    .circuit { fill:none;stroke:#5986aa;stroke-width:2;stroke-dasharray:5 8; }
    @media (prefers-reduced-motion: no-preference) {
      .pulse { animation: pulse 4.2s ease-in-out infinite; }
      .circuit { animation: circuit 6s linear infinite; }
      @keyframes pulse { 0%,100% { opacity:.62; } 50% { opacity:1;r:6; } }
      @keyframes circuit { to { stroke-dashoffset:-52; } }
    }
  </style>
  <rect width="760" height="650" rx="20" fill="url(#panel)"/>
  <path d="M30 25h96" class="circuit"/>
  <circle cx="137" cy="25" r="4" class="pulse" style="animation-delay:-0s"/>
  <text x="30" y="65" class="title">Trayectoria y formación</text>
  <rect x="30" y="87" width="700" height="74" rx="13" class="tile"/><circle cx="51" cy="106" r="4" class="pulse" style="animation-delay:-0s"/><text x="66" y="111" class="name">YB Veltrix Solutions</text><text x="66" y="133" class="meta">Fundador · julio 2025 a la actualidad</text><text x="66" y="152" class="body">Aplicaciones web, APIs y productos SaaS.</text>
  <rect x="30" y="170" width="700" height="74" rx="13" class="tile"/><circle cx="51" cy="189" r="4" class="pulse" style="animation-delay:-0.64s"/><text x="66" y="194" class="name">Grupo Belator</text><text x="66" y="216" class="meta">Técnico de Soporte TI · julio 2025 a mayo 2026</text><text x="66" y="235" class="body">Continuidad tecnológica, equipos e infraestructura.</text>
  <rect x="30" y="253" width="700" height="74" rx="13" class="tile"/><circle cx="51" cy="272" r="4" class="pulse" style="animation-delay:-1.28s"/><text x="66" y="277" class="name">Reimpact</text><text x="66" y="299" class="meta">Ingeniería de software · septiembre a noviembre 2025</text><text x="66" y="318" class="body">Desarrollo de software a medida.</text>
  <rect x="30" y="336" width="700" height="74" rx="13" class="tile"/><circle cx="51" cy="355" r="4" class="pulse" style="animation-delay:-1.92s"/><text x="66" y="360" class="name">TIC Services SpA</text><text x="66" y="382" class="meta">Hospital Gustavo Fricke · diciembre 2022 a febrero 2025</text><text x="66" y="401" class="body">Sistemas hospitalarios y aplicaciones críticas.</text>
  <rect x="30" y="419" width="700" height="74" rx="13" class="tile"/><circle cx="51" cy="438" r="4" class="pulse" style="animation-delay:-2.56s"/><text x="66" y="443" class="name">Nutech SpA</text><text x="66" y="465" class="meta">Universidad Andrés Bello · agosto 2021 a diciembre 2022</text><text x="66" y="484" class="body">Tecnología para docencia y clases híbridas.</text><rect x="30" y="508" width="700" height="110" rx="13" class="tile"/><circle cx="51" cy="531" r="4" class="pulse" style="animation-delay:-0s"/><text x="66" y="537" class="name">Formación</text><text x="66" y="564" class="body">Ingeniería en Computación e Informática · Universidad Andrés Bello</text><text x="66" y="586" class="meta">Licenciado en Ingeniería · Universidad Andrés Bello</text><text x="66" y="608" class="meta">Técnico de Nivel Superior en Programación Computacional · AIEP</text>
</svg>
