<svg xmlns="http://www.w3.org/2000/svg" width="760" height="206" viewBox="0 0 760 206" role="img" aria-labelledby="title desc">
  <title id="title">Pruebas automatizadas</title>
  <desc id="desc">Escena ilustrativa de un flujo de pruebas. Tres comprobaciones se iluminan en secuencia y el ciclo vuelve a empezar.</desc>
  <style>
    text { font-family:system-ui,sans-serif }
    @media (prefers-reduced-motion: no-preference) {
      .check { animation:verify 5.4s ease-in-out infinite }
      .two { animation-delay:.55s }
      .three { animation-delay:1.1s }
      .scan { animation:scan 5.4s linear infinite }
    }
    @keyframes verify { 0%,7%,100% { opacity:.26 } 21%,78% { opacity:1 } }
    @keyframes scan { 0%,81%,100% { opacity:0 } 8%,65% { opacity:.8 } 65%,100% { transform:translateY(102px) } }
  </style>
  <rect width="760" height="206" rx="19" fill="#081f3b"/>
  <circle cx="143" cy="104" r="65" fill="#153b5c" stroke="#3e7499"/>
  <path d="M143 56l38 14v33c0 23-18 38-38 49-20-11-38-26-38-49V70Z" fill="#0e2e4d" stroke="#7eb9e9" stroke-width="2"/>
  <path d="m126 102 11 11 24-27" fill="none" stroke="#72dbc0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="243" y="48" fill="#edf7ff" font-size="24" font-weight="700">Pruebas automatizadas</text>
  <text x="244" y="72" fill="#b1cce4" font-size="14">Validación de una aplicación ilustrativa</text>
  <path d="M254 98v73" stroke="#356287" stroke-width="2"/>
  <path class="scan" d="M241 78h436" stroke="#73c5ff" stroke-width="1" opacity=".24"/>
  <g fill="#c7def3" font-size="14">
    <text x="278" y="109">Lógica y casos de prueba</text>
    <text x="278" y="143">Integración de la API</text>
    <text x="278" y="177">Flujo en navegador</text>
  </g>
  <g fill="#112f4b" stroke="#477896">
    <circle cx="254" cy="104" r="11"/><circle cx="254" cy="138" r="11"/><circle cx="254" cy="172" r="11"/>
  </g>
  <g fill="none" stroke="#72dbc0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path class="check" d="m249 104 3 3 6-7"/><path class="check two" d="m249 138 3 3 6-7"/><path class="check three" d="m249 172 3 3 6-7"/>
  </g>
</svg>
