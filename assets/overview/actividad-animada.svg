<svg xmlns="http://www.w3.org/2000/svg" width="760" height="215" viewBox="0 0 760 215" role="img" aria-labelledby="title desc">
  <title id="title">Actividad en GitHub</title>
  <desc id="desc">Resumen público de 2026. Las cifras exactas y su alcance también aparecen en la tabla del perfil.</desc>
  <defs>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#0b2343"/><stop offset="1" stop-color="#102f52"/></linearGradient>
  </defs>
  <style>
    text { font-family:system-ui,sans-serif; }
    .title { font-size:32px;font-weight:750;fill:#f3f8ff; }
    .body { font-size:17px;fill:#cedfee; }
    .meta { font-size:15px;fill:#b5d1ea; }
    .name { font-size:18px;font-weight:720;fill:#f3f8ff; }
    .accent { font-size:17px;font-weight:700;fill:#ffc177; }
    .tile { fill:#142f4e;stroke:#345a7d; }
    .pulse { fill:#ffc177; }
    .circuit { fill:none;stroke:#5986aa;stroke-width:2;stroke-dasharray:5 8; }
    @media (prefers-reduced-motion: no-preference) {
      .pulse { animation: pulse 4.2s ease-in-out infinite; }
      .circuit { animation: circuit 6s linear infinite; }
      @keyframes pulse { 0%,100% { opacity:.62; } 50% { opacity:1;r:6; } }
      @keyframes circuit { to { stroke-dashoffset:-52; } }
    }
  </style>
  <rect width="760" height="215" rx="20" fill="url(#panel)"/>
  <path d="M30 25h96" class="circuit"/>
  <circle cx="137" cy="25" r="4" class="pulse" style="animation-delay:-0s"/>
  <text x="30" y="65" class="title">Actividad en GitHub</text>
  <rect x="30" y="88" width="333" height="86" rx="13" class="tile"/><rect x="380" y="88" width="350" height="86" rx="13" class="tile"/><circle cx="50" cy="108" r="4" class="pulse" style="animation-delay:-0s"/><circle cx="400" cy="108" r="4" class="pulse" style="animation-delay:-1.28s"/><text x="65" y="116" class="name">Commits públicos</text><text x="65" y="151" class="accent">84</text><text x="415" y="116" class="name">Contribuciones visibles</text><text x="415" y="151" class="accent">111</text><text x="30" y="198" class="meta">2026 · corte al 23 de noviembre</text>
</svg>
