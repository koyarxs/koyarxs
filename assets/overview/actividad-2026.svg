<svg xmlns="http://www.w3.org/2000/svg" width="760" height="395" viewBox="0 0 760 395" role="img" aria-labelledby="title desc">
  <title id="title">Actividad pública de Yerko en GitHub durante 2026</title>
  <desc id="desc">Barras de los meses con actividad registrada. Los valores exactos también aparecen en la tabla mensual del perfil.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #eef6ff; }
    .heading { font-size: 26px; font-weight: 700; }
    .legend, .month { font-size: 16px; }
    .count { font-size: 14px; font-weight: 700; }
    @media (prefers-reduced-motion: no-preference) {
      .bar { transform-box: fill-box; transform-origin: left center; animation: grow .75s ease-out var(--delay) both; }
      .contributions { animation-duration: .95s; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    }
  </style>
  <rect width="760" height="395" rx="20" fill="#071f3c" />
  <text x="30" y="44" class="heading">Actividad en GitHub · 2026</text>
  <circle cx="36" cy="72" r="5" fill="#73b7ff" />
  <text x="50" y="77" class="legend">Commits públicos</text>
  <circle cx="231" cy="72" r="5" fill="#ffad4e" />
  <text x="245" y="77" class="legend">Contribuciones visibles</text>
  <g style="--delay:0ms"><text x="30" y="123" class="month">Mayo 2026</text><rect class="bar commits" x="233" y="108" width="19" height="10" rx="5" fill="#73b7ff" /><text x="260" y="117" class="count">3</text><rect class="bar contributions" x="233" y="124" width="26" height="10" rx="5" fill="#ffad4e" /><text x="267" y="133" class="count">4</text></g>
  <g style="--delay:115ms"><text x="30" y="176" class="month">Agosto 2026</text><rect class="bar commits" x="233" y="161" width="19" height="10" rx="5" fill="#73b7ff" /><text x="260" y="170" class="count">3</text><rect class="bar contributions" x="233" y="177" width="26" height="10" rx="5" fill="#ffad4e" /><text x="267" y="186" class="count">4</text></g>
  <g style="--delay:230ms"><text x="30" y="229" class="month">Septiembre 2026</text><rect class="bar commits" x="233" y="214" width="58" height="10" rx="5" fill="#73b7ff" /><text x="299" y="223" class="count">9</text><rect class="bar contributions" x="233" y="230" width="84" height="10" rx="5" fill="#ffad4e" /><text x="325" y="239" class="count">13</text></g>
  <g style="--delay:345ms"><text x="30" y="282" class="month">Octubre 2026</text><rect class="bar commits" x="233" y="267" width="331" height="10" rx="5" fill="#73b7ff" /><text x="572" y="276" class="count">51</text><rect class="bar contributions" x="233" y="283" width="441" height="10" rx="5" fill="#ffad4e" /><text x="682" y="292" class="count">68</text></g>
  <g style="--delay:460ms"><text x="30" y="335" class="month">Noviembre 2026</text><rect class="bar commits" x="233" y="320" width="117" height="10" rx="5" fill="#73b7ff" /><text x="358" y="329" class="count">18</text><rect class="bar contributions" x="233" y="336" width="143" height="10" rx="5" fill="#ffad4e" /><text x="384" y="345" class="count">22</text></g>
</svg>
